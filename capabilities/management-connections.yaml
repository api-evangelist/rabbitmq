naftiko: 1.0.0-alpha2
info:
  label: RabbitMQ Management HTTP API — Connections
  description: 'RabbitMQ Management HTTP API — Connections. 3 operations. Lead operation: List connections. Self-contained
    Naftiko capability covering one Rabbitmq business surface.'
  tags:
  - Rabbitmq
  - Connections
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RABBITMQ_API_KEY: RABBITMQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-connections
    baseUri: http://localhost:15672/api
    description: RabbitMQ Management HTTP API — Connections business capability. Self-contained, no shared references.
    resources:
    - name: connections
      path: /connections
      operations:
      - name: listconnections
        method: GET
        description: List connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: connections-name
      path: /connections/{name}
      operations:
      - name: getconnection
        method: GET
        description: Get connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
      - name: deleteconnection
        method: DELETE
        description: Close connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
    authentication:
      type: basic
      username: '{{env.RABBITMQ_USER}}'
      password: '{{env.RABBITMQ_PASS}}'
  exposes:
  - type: rest
    namespace: management-connections-rest
    port: 8080
    description: REST adapter for RabbitMQ Management HTTP API — Connections. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/connections
      name: connections
      description: REST surface for connections.
      operations:
      - method: GET
        name: listconnections
        description: List connections
        call: management-connections.listconnections
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connections/{name}
      name: connections-name
      description: REST surface for connections-name.
      operations:
      - method: GET
        name: getconnection
        description: Get connection
        call: management-connections.getconnection
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteconnection
        description: Close connection
        call: management-connections.deleteconnection
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-connections-mcp
    port: 9090
    transport: http
    description: MCP adapter for RabbitMQ Management HTTP API — Connections. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-connections
      description: List connections
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-connections.listconnections
      outputParameters:
      - type: object
        mapping: $.
    - name: get-connection
      description: Get connection
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-connections.getconnection
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: close-connection
      description: Close connection
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: management-connections.deleteconnection
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
