naftiko: 1.0.0-alpha2
info:
  label: RabbitMQ Management HTTP API — Overview
  description: 'RabbitMQ Management HTTP API — Overview. 3 operations. Lead operation: Get cluster name. Self-contained Naftiko
    capability covering one Rabbitmq business surface.'
  tags:
  - Rabbitmq
  - Overview
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RABBITMQ_API_KEY: RABBITMQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-overview
    baseUri: http://localhost:15672/api
    description: RabbitMQ Management HTTP API — Overview business capability. Self-contained, no shared references.
    resources:
    - name: cluster-name
      path: /cluster-name
      operations:
      - name: getclustername
        method: GET
        description: Get cluster name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: setclustername
        method: PUT
        description: Set cluster name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: overview
      path: /overview
      operations:
      - name: getoverview
        method: GET
        description: Get cluster overview
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.RABBITMQ_USER}}'
      password: '{{env.RABBITMQ_PASS}}'
  exposes:
  - type: rest
    namespace: management-overview-rest
    port: 8080
    description: REST adapter for RabbitMQ Management HTTP API — Overview. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/cluster-name
      name: cluster-name
      description: REST surface for cluster-name.
      operations:
      - method: GET
        name: getclustername
        description: Get cluster name
        call: management-overview.getclustername
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: setclustername
        description: Set cluster name
        call: management-overview.setclustername
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/overview
      name: overview
      description: REST surface for overview.
      operations:
      - method: GET
        name: getoverview
        description: Get cluster overview
        call: management-overview.getoverview
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-overview-mcp
    port: 9090
    transport: http
    description: MCP adapter for RabbitMQ Management HTTP API — Overview. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-cluster-name
      description: Get cluster name
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-overview.getclustername
      outputParameters:
      - type: object
        mapping: $.
    - name: set-cluster-name
      description: Set cluster name
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: management-overview.setclustername
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-cluster-overview
      description: Get cluster overview
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-overview.getoverview
      outputParameters:
      - type: object
        mapping: $.
