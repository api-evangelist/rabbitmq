naftiko: 1.0.0-alpha2
info:
  label: RabbitMQ Management HTTP API — Permissions
  description: 'RabbitMQ Management HTTP API — Permissions. 3 operations. Lead operation: Get user permissions. Self-contained
    Naftiko capability covering one Rabbitmq business surface.'
  tags:
  - Rabbitmq
  - Permissions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RABBITMQ_API_KEY: RABBITMQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-permissions
    baseUri: http://localhost:15672/api
    description: RabbitMQ Management HTTP API — Permissions business capability. Self-contained, no shared references.
    resources:
    - name: permissions-vhost-user
      path: /permissions/{vhost}/{user}
      operations:
      - name: getuserpermissions
        method: GET
        description: Get user permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vhost
          in: path
          type: string
          required: true
        - name: user
          in: path
          type: string
          required: true
      - name: setuserpermissions
        method: PUT
        description: Set user permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vhost
          in: path
          type: string
          required: true
        - name: user
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteuserpermissions
        method: DELETE
        description: Delete user permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vhost
          in: path
          type: string
          required: true
        - name: user
          in: path
          type: string
          required: true
    authentication:
      type: basic
      username: '{{env.RABBITMQ_USER}}'
      password: '{{env.RABBITMQ_PASS}}'
  exposes:
  - type: rest
    namespace: management-permissions-rest
    port: 8080
    description: REST adapter for RabbitMQ Management HTTP API — Permissions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/permissions/{vhost}/{user}
      name: permissions-vhost-user
      description: REST surface for permissions-vhost-user.
      operations:
      - method: GET
        name: getuserpermissions
        description: Get user permissions
        call: management-permissions.getuserpermissions
        with:
          vhost: rest.vhost
          user: rest.user
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: setuserpermissions
        description: Set user permissions
        call: management-permissions.setuserpermissions
        with:
          vhost: rest.vhost
          user: rest.user
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteuserpermissions
        description: Delete user permissions
        call: management-permissions.deleteuserpermissions
        with:
          vhost: rest.vhost
          user: rest.user
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-permissions-mcp
    port: 9090
    transport: http
    description: MCP adapter for RabbitMQ Management HTTP API — Permissions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-user-permissions
      description: Get user permissions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-permissions.getuserpermissions
      with:
        vhost: tools.vhost
        user: tools.user
      outputParameters:
      - type: object
        mapping: $.
    - name: set-user-permissions
      description: Set user permissions
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: management-permissions.setuserpermissions
      with:
        vhost: tools.vhost
        user: tools.user
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-user-permissions
      description: Delete user permissions
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: management-permissions.deleteuserpermissions
      with:
        vhost: tools.vhost
        user: tools.user
      outputParameters:
      - type: object
        mapping: $.
