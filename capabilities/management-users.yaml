naftiko: 1.0.0-alpha2
info:
  label: RabbitMQ Management HTTP API — Users
  description: 'RabbitMQ Management HTTP API — Users. 5 operations. Lead operation: List users. Self-contained Naftiko capability
    covering one Rabbitmq business surface.'
  tags:
  - Rabbitmq
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RABBITMQ_API_KEY: RABBITMQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-users
    baseUri: http://localhost:15672/api
    description: RabbitMQ Management HTTP API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users-user
      path: /users/{user}
      operations:
      - name: getuser
        method: GET
        description: Get user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user
          in: path
          type: string
          required: true
      - name: createuser
        method: PUT
        description: Create or update user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteuser
        method: DELETE
        description: Delete user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user
          in: path
          type: string
          required: true
    - name: whoami
      path: /whoami
      operations:
      - name: whoami
        method: GET
        description: Get current user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.RABBITMQ_USER}}'
      password: '{{env.RABBITMQ_PASS}}'
  exposes:
  - type: rest
    namespace: management-users-rest
    port: 8080
    description: REST adapter for RabbitMQ Management HTTP API — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listusers
        description: List users
        call: management-users.listusers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{user}
      name: users-user
      description: REST surface for users-user.
      operations:
      - method: GET
        name: getuser
        description: Get user
        call: management-users.getuser
        with:
          user: rest.user
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: createuser
        description: Create or update user
        call: management-users.createuser
        with:
          user: rest.user
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteuser
        description: Delete user
        call: management-users.deleteuser
        with:
          user: rest.user
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/whoami
      name: whoami
      description: REST surface for whoami.
      operations:
      - method: GET
        name: whoami
        description: Get current user
        call: management-users.whoami
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for RabbitMQ Management HTTP API — Users. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-users
      description: List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-users.listusers
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-users.getuser
      with:
        user: tools.user
      outputParameters:
      - type: object
        mapping: $.
    - name: create-update-user
      description: Create or update user
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: management-users.createuser
      with:
        user: tools.user
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-user
      description: Delete user
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: management-users.deleteuser
      with:
        user: tools.user
      outputParameters:
      - type: object
        mapping: $.
    - name: get-current-user
      description: Get current user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-users.whoami
      outputParameters:
      - type: object
        mapping: $.
